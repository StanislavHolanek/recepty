<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Martinčina kuchařka</title>
  <meta name="theme-color" content="#800020" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#800020" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:wght@400;600;700;800&display=swap">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Martinka">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn back" id="backBtn" aria-label="Zpět" hidden>
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <svg class="flower" id="topFlower" viewBox="0 0 40 40" aria-hidden="true">
      <g fill="#d98a9c"><ellipse cx="20" cy="10.5" rx="6.3" ry="9"/><ellipse cx="20" cy="10.5" rx="6.3" ry="9" transform="rotate(72 20 20)"/><ellipse cx="20" cy="10.5" rx="6.3" ry="9" transform="rotate(144 20 20)"/><ellipse cx="20" cy="10.5" rx="6.3" ry="9" transform="rotate(216 20 20)"/><ellipse cx="20" cy="10.5" rx="6.3" ry="9" transform="rotate(288 20 20)"/></g>
      <circle cx="20" cy="20" r="5" fill="#d4a24c"/>
    </svg>
    <h1 id="pageTitle">Martinčina kuchařka</h1>
    <span class="mode-badge" id="modeBadge" hidden>DEMO</span>
  </header>

  <main id="app"><div class="loading">Načítám…</div></main>

  <nav class="tabbar" id="tabbar" hidden>
    <a href="#/" data-tab="list">
      <svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg><span>Recepty</span>
    </a>
    <a href="#/tyden" data-tab="tyden">
      <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Týden</span>
    </a>
    <a href="#/new" data-tab="new">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Přidat</span>
    </a>
    <a href="#/shop" data-tab="shop">
      <svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h11L21 7H6.2"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>
      <span>Nákup</span><b class="count" id="shopCount" hidden></b>
    </a>
    <a href="#/more" data-tab="more">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span>Více</span>
    </a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="lightbox" id="lightbox" hidden><img alt=""></div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
